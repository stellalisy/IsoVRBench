# What IsoVRBench ships with.
#
# Each family has a knob controlling how severe its degradation is. Change one
# and the same code produces an easier or harder pair.

# ---- the anchor video ------------------------------------------------------
# These apply to every family, so changing one changes every pair. Fewer frames
# makes shuffle and mq_hold more severe, since each segment and each held run
# gets shorter.
width: 832
height: 480
num_frames: 81
fps: 16
guidance: 5.0
steps: 50
# Shared by the anchor and every re-render, so the intervention is the only
# difference between the two clips.
seed: 10

# ---- vq_steps: denoising steps for the degraded clip -----------------------
# Lower is more degraded. 8 is the benchmark, 16 the training corpus, and the
# two are about 13 points of model accuracy apart on the same items.
vq_steps: 8

# ---- ta_attrib: attributes edited in the prompt ----------------------------
# Higher is more degraded, since more of the prompt is contradicted.
ta_attrib_k: 1

# ---- mq_hold: real frames held until the next is due -----------------------
# Candidates, one drawn per clip. Fewer keyframes is more degraded, since each
# is held longer.
mq_hold_keyframes: [8, 12]

# ---- mq_gen: keyframes kept while the gaps are regenerated -----------------
# Fewer keyframes is more degraded, since the motion drifts longer before it is
# snapped back to a real frame.
mq_gen_keyframes: [8, 12]
mq_gen_steps: 30

# ---- shuffle: contiguous segments permuted ---------------------------------
# More segments is more degraded, since the order is scrambled finer.
shuffle_segments: 6
# Reordering a clip that barely moves changes nothing visible, so clips below
# this are skipped. Higher keeps fewer, clearer pairs. 25 keeps about 23 percent
# of anchors; the median generated clip scores around 12.
#
# IsoVRBench itself was not built with a threshold. It took the 1,000 highest
# motion anchors, which put its floor at 18.3 and its median at 24.6. Set this
# to 18.3 to approximate that selection.
shuffle_motion_min: 25.0

# ---- the generators --------------------------------------------------------
# Any checkpoint diffusers can load with WanPipeline, or a local directory.
# Nothing about the interventions is tied to these four; the size families just
# need a generator weaker than the anchor's, and which one decides what
# "weaker" means. The 1.3B and 5B models here are differently weak rather than
# more and less weak, so the two size families are not a severity ladder.
#
# To use a generator of your own, render the anchors with it and pass them to
# --anchors, which needs no model at all. See the README.
models:
  anchor: Wan-AI/Wan2.2-T2V-A14B-Diffusers      # renders the anchor, and vq_steps and ta_attrib
  weaker_t2v: Wan-AI/Wan2.1-T2V-1.3B-Diffusers  # rejected side of size_1p3b
  weaker_t2v_2: Wan-AI/Wan2.2-TI2V-5B-Diffusers # rejected side of size_5b
  i2v: Wan-AI/Wan2.2-TI2V-5B-Diffusers          # size_i2v, continues a frame
  i2v_strong: Wan-AI/Wan2.2-I2V-A14B-Diffusers  # mq_gen, regenerates the gaps
